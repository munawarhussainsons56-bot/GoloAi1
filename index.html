<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether AI Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            light: '#ffffff',
                            dark: '#0f172a',
                            'dark-card': '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 3px; }
        .prose pre { background-color: #0f172a !important; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
        .prose code { color: #38bdf8; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased font-sans h-screen flex overflow-hidden">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-slate-950 border-r border-slate-800/80 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col justify-between p-4">
        <div class="flex flex-col h-full">
            <div class="flex items-center justify-between mb-4">
                <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-sky-600 hover:bg-sky-500 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg transition-all">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>New Chat</span>
                </button>
                <button onclick="toggleSidebar()" class="md:hidden ml-2 p-2 text-slate-400">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="chat-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>

            <div class="pt-4 border-t border-slate-800 space-y-1">
                <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-slate-200 text-sm">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings & Key</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-slate-900 relative">
        <!-- TOP HEADER -->
        <header class="h-14 border-b border-slate-800 px-4 flex items-center justify-between bg-slate-900/60 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 p-1.5">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <select id="model-select" onchange="changeModel()" class="bg-slate-800 text-slate-200 text-xs font-semibold py-1.5 px-3 rounded-lg border border-slate-700">
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                </select>
            </div>
            <button onclick="startVoiceMode()" class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-indigo-600 text-white text-xs px-3 py-1.5 rounded-full shadow-md">
                <i class="fa-solid fa-headset"></i>
                <span>Voice Mode</span>
            </button>
        </header>

        <!-- CHAT MESSAGES -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 max-w-4xl mx-auto w-full">
            <div id="welcome-state" class="h-full flex flex-col items-center justify-center text-center my-auto py-12">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center mb-6">
                    <i class="fa-solid fa-sparkles text-3xl text-white"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-100 mb-2">How can I help you today?</h1>
                <p class="text-slate-400 text-sm max-w-md">Type a message, use speech-to-text, or launch real-time voice mode.</p>
            </div>
            <div id="messages-list" class="space-y-6 hidden"></div>
        </div>

        <!-- COMPOSER -->
        <div class="p-4 max-w-4xl mx-auto w-full">
            <div class="relative bg-slate-800 border border-slate-700 rounded-2xl p-2 focus-within:border-sky-500">
                <textarea id="composer-input" rows="1" oninput="autoGrow(this)" onkeydown="handleKeyDown(event)" placeholder="Ask anything..." class="w-full bg-transparent text-slate-100 placeholder-slate-500 px-3 pt-2 pb-10 focus:outline-none resize-none max-h-48 text-sm"></textarea>
                <div class="absolute bottom-2.5 left-3 right-3 flex items-center justify-between pt-2 border-t border-slate-700/50">
                    <div></div>
                    <div class="flex items-center gap-2">
                        <button id="stt-btn" onclick="toggleSpeechToText()" class="p-2 text-slate-400 hover:text-sky-400" title="Speech to Text">
                            <i id="stt-icon" class="fa-solid fa-microphone"></i>
                        </button>
                        <button id="send-btn" onclick="submitMessage()" class="w-8 h-8 rounded-xl bg-sky-600 hover:bg-sky-500 text-white flex items-center justify-center shadow-md">
                            <i id="send-icon" class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- VOICE MODE OVERLAY -->
    <div id="voice-overlay" class="fixed inset-0 bg-slate-950/95 z-50 flex flex-col justify-between p-6 hidden">
        <div class="flex items-center justify-between max-w-2xl mx-auto w-full">
            <span class="text-xs font-mono uppercase text-emerald-400 tracking-widest">● Voice Mode Live</span>
            <button onclick="stopVoiceMode()" class="p-2 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center my-auto">
            <canvas id="voice-canvas" width="300" height="300" class="rounded-full"></canvas>
            <p id="voice-status-label" class="mt-6 text-lg font-medium text-slate-200">Listening...</p>
        </div>
        <div class="max-w-md mx-auto w-full flex items-center justify-center pb-6">
            <button onclick="stopVoiceMode()" class="w-14 h-14 rounded-full bg-red-600 text-white flex items-center justify-center shadow-lg"><i class="fa-solid fa-phone-slash text-lg"></i></button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative">
            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-2">
                <h3 class="text-lg font-semibold text-slate-100">Settings</h3>
                <button onclick="closeSettings()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Gemini API Key</label>
                    <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                </div>
                <div class="flex justify-end pt-2">
                    <button onclick="saveSettings()" class="bg-sky-600 text-white text-xs px-4 py-2 rounded-xl">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default Key injected by GitHub Actions OR stored in LocalStorage
        const INJECTED_KEY = "YOUR_GEMINI_API_KEY_PLACEHOLDER";
        const APP_STATE = {
            chats: JSON.parse(localStorage.getItem('aether_chats') || '[]'),
            currentChatId: localStorage.getItem('aether_active_chat') || null,
            apiKey: localStorage.getItem('aether_api_key') || (INJECTED_KEY.startsWith("AIza") ? INJECTED_KEY : ''),
            model: localStorage.getItem('aether_model') || 'gemini-2.5-flash',
            isGenerating: false,
            sttActive: false,
            voiceActive: false
        };

        marked.setOptions({ breaks: true });

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('api-key-input').value = APP_STATE.apiKey;
            renderChatList();
            if (APP_STATE.currentChatId) loadChat(APP_STATE.currentChatId);
            else createNewChat(false);
        });

        function saveState() {
            localStorage.setItem('aether_chats', JSON.stringify(APP_STATE.chats));
            localStorage.setItem('aether_active_chat', APP_STATE.currentChatId || '');
            localStorage.setItem('aether_api_key', APP_STATE.apiKey);
            localStorage.setItem('aether_model', APP_STATE.model);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 192) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 768) {
                e.preventDefault();
                submitMessage();
            }
        }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
        function saveSettings() {
            APP_STATE.apiKey = document.getElementById('api-key-input').value.trim();
            saveState();
            closeSettings();
        }

        function createNewChat(switchChat = true) {
            const newChat = { id: 'chat_' + Date.now(), title: 'New Conversation', messages: [] };
            APP_STATE.chats.unshift(newChat);
            if (switchChat) APP_STATE.currentChatId = newChat.id;
            saveState();
            renderChatList();
            if (switchChat) loadChat(newChat.id);
        }

        function loadChat(chatId) {
            APP_STATE.currentChatId = chatId;
            saveState();
            renderChatList();
            const chat = APP_STATE.chats.find(c => c.id === chatId);
            const listEl = document.getElementById('messages-list');
            listEl.innerHTML = '';
            if (!chat || chat.messages.length === 0) {
                document.getElementById('welcome-state').classList.remove('hidden');
                listEl.classList.add('hidden');
            } else {
                document.getElementById('welcome-state').classList.add('hidden');
                listEl.classList.remove('hidden');
                chat.messages.forEach(m => appendMessageUI(m.role, m.content));
            }
        }

        function renderChatList() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';
            APP_STATE.chats.forEach(c => {
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-xl cursor-pointer text-xs truncate ${c.id === APP_STATE.currentChatId ? 'bg-slate-800 text-white font-medium' : 'text-slate-400 hover:bg-slate-800/50'}`;
                item.innerText = c.title;
                item.onclick = () => loadChat(c.id);
                listEl.appendChild(item);
            });
        }

        function appendMessageUI(role, content) {
            const listEl = document.getElementById('messages-list');
            document.getElementById('welcome-state').classList.add('hidden');
            listEl.classList.remove('hidden');

            const isUser = role === 'user';
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} mb-4`;
            div.innerHTML = `
                <div class="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm ${isUser ? 'bg-sky-600 text-white' : 'bg-slate-800 text-slate-200 prose prose-invert'}">
                    ${isUser ? content : marked.parse(content)}
                </div>
            `;
            listEl.appendChild(div);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
            return div;
        }

        async function submitMessage() {
            const input = document.getElementById('composer-input');
            const text = input.value.trim();
            if (!text || APP_STATE.isGenerating) return;

            if (!APP_STATE.apiKey) {
                openSettings();
                return;
            }

            const chat = APP_STATE.chats.find(c => c.id === APP_STATE.currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 20);

            chat.messages.push({ role: 'user', content: text });
            appendMessageUI('user', text);
            input.value = '';

            const aiDiv = appendMessageUI('assistant', '...');
            const aiContent = aiDiv.querySelector('div');

            APP_STATE.isGenerating = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${APP_STATE.model}:generateContent?key=${APP_STATE.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chat.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] }))
                    })
                });
                const data = await response.json();
                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
                aiContent.innerHTML = marked.parse(reply);
                chat.messages.push({ role: 'assistant', content: reply });
                saveState();
            } catch (err) {
                aiContent.innerText = 'Error generating response.';
            } finally {
                APP_STATE.isGenerating = false;
            }
        }

        /* Speech-to-Text */
        function toggleSpeechToText() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert('Speech recognition not supported.');
            const rec = new SpeechRecognition();
            rec.onresult = (e) => {
                document.getElementById('composer-input').value = e.results[0][0].transcript;
            };
            rec.start();
        }

        /* Voice Mode */
        function startVoiceMode() {
            APP_STATE.voiceActive = true;
            document.getElementById('voice-overlay').classList.remove('hidden');
        }
        function stopVoiceMode() {
            APP_STATE.voiceActive = false;
            document.getElementById('voice-overlay').classList.add('hidden');
        }
    </script>
</body>
</html>
