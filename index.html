<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether AI Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            light: '#ffffff',
                            'light-subtle': '#f8fafc',
                            dark: '#0f172a',
                            'dark-card': '#1e293b',
                            'dark-hover': '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.5); }
        
        .prose pre { background-color: #0f172a !important; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin-top: 0.5rem; margin-bottom: 0.5rem; }
        .prose code { color: #38bdf8; font-size: 0.875em; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.625; }
        .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .prose table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; margin-bottom: 0.75rem; }
        .prose th, .prose td { border: 1px solid rgba(156, 163, 175, 0.2); padding: 0.5rem 0.75rem; text-align: left; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans h-screen flex overflow-hidden light:bg-slate-50 light:text-slate-800 transition-colors">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-20 hidden md:hidden backdrop-blur-sm" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-slate-900/90 border-r border-slate-800/80 transform -translate-x-full md:translate-x-0 transition-transform duration-300 flex flex-col justify-between p-4 backdrop-blur-xl">
        <div class="flex flex-col h-full">
            <!-- New Chat Button -->
            <div class="flex items-center justify-between mb-4">
                <button onclick="createNewChat()" class="flex-1 flex items-center justify-center gap-2 bg-sky-600 hover:bg-sky-500 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-sky-600/20 transition-all active:scale-[0.98]">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>New Chat</span>
                </button>
                <button onclick="toggleSidebar()" class="md:hidden ml-2 p-2 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Search input -->
            <div class="relative mb-4">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                <input type="text" id="chat-search" oninput="filterChats()" placeholder="Search conversations..." class="w-full bg-slate-950/80 text-xs text-slate-200 placeholder-slate-500 pl-8 pr-3 py-2 rounded-xl border border-slate-800 focus:outline-none focus:border-sky-500/50">
            </div>

            <!-- Chat List -->
            <div id="chat-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1"></div>

            <!-- Footer Controls -->
            <div class="pt-4 border-t border-slate-800/80 space-y-1">
                <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 text-xs font-medium transition-colors">
                    <i class="fa-solid fa-gear text-slate-500"></i>
                    <span>Settings & API Key</span>
                </button>
                <button onclick="toggleTheme()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 text-xs font-medium transition-colors">
                    <i id="theme-icon" class="fa-solid fa-moon text-slate-500"></i>
                    <span id="theme-text">Toggle Theme</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN CHAT CANVAS -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-slate-950 light:bg-slate-50 relative">
        <!-- HEADER -->
        <header class="h-14 border-b border-slate-800/80 light:border-slate-200 px-4 flex items-center justify-between bg-slate-950/60 light:bg-white/60 backdrop-blur-md z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                
                <div class="relative inline-block text-left">
                    <select id="model-select" onchange="changeModel()" class="bg-slate-900 light:bg-slate-100 text-slate-200 light:text-slate-800 text-xs font-semibold py-1.5 px-3 pr-7 rounded-xl border border-slate-800 light:border-slate-300 focus:outline-none cursor-pointer appearance-none">
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-2.5 top-2.5 text-[10px] text-slate-500 pointer-events-none"></i>
                </div>
            </div>

            <button onclick="startVoiceMode()" title="Launch Voice Mode" class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white text-xs font-medium px-3.5 py-1.5 rounded-full shadow-md shadow-sky-500/10 transition-all active:scale-95">
                <i class="fa-solid fa-headset text-xs"></i>
                <span>Voice Mode</span>
            </button>
        </header>

        <!-- MESSAGES / WELCOME -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-3xl mx-auto w-full">
            <!-- WELCOME STATE -->
            <div id="welcome-state" class="h-full flex flex-col items-center justify-center text-center my-auto py-12">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center shadow-xl shadow-sky-500/20 mb-6">
                    <i class="fa-solid fa-sparkles text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-100 light:text-slate-800 mb-2 tracking-tight">How can I help you today?</h1>
                <p class="text-slate-400 light:text-slate-500 max-w-sm text-xs mb-8">Ask anything, brainstorm solutions, analyze code, or launch real-time voice mode.</p>
                
                <!-- Suggestion Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-xl text-left">
                    <button onclick="usePrompt('Help me brainstorm YouTube Shorts content ideas about AI developments')" class="p-3.5 rounded-2xl border border-slate-800/80 light:border-slate-200 bg-slate-900/50 light:bg-white hover:bg-slate-800/60 light:hover:bg-slate-100 transition-all text-xs text-slate-300 light:text-slate-700 flex flex-col justify-between h-20 group">
                        <span class="font-semibold group-hover:text-sky-400 transition-colors">Brainstorm Content</span>
                        <span class="text-slate-500 text-[11px]">YouTube Shorts ideas on AI advancements</span>
                    </button>
                    <button onclick="usePrompt('Write a clean JavaScript function to handle stream responses from an API')" class="p-3.5 rounded-2xl border border-slate-800/80 light:border-slate-200 bg-slate-900/50 light:bg-white hover:bg-slate-800/60 light:hover:bg-slate-100 transition-all text-xs text-slate-300 light:text-slate-700 flex flex-col justify-between h-20 group">
                        <span class="font-semibold group-hover:text-sky-400 transition-colors">Code Assistant</span>
                        <span class="text-slate-500 text-[11px]">JS function for stream response handling</span>
                    </button>
                    <button onclick="usePrompt('Explain the concept of Web Audio API AnalyserNode simply')" class="p-3.5 rounded-2xl border border-slate-800/80 light:border-slate-200 bg-slate-900/50 light:bg-white hover:bg-slate-800/60 light:hover:bg-slate-100 transition-all text-xs text-slate-300 light:text-slate-700 flex flex-col justify-between h-20 group">
                        <span class="font-semibold group-hover:text-sky-400 transition-colors">Explain Concepts</span>
                        <span class="text-slate-500 text-[11px]">Web Audio API AnalyserNode breakdown</span>
                    </button>
                    <button onclick="usePrompt('Draft an engaging announcement email for a new product release')" class="p-3.5 rounded-2xl border border-slate-800/80 light:border-slate-200 bg-slate-900/50 light:bg-white hover:bg-slate-800/60 light:hover:bg-slate-100 transition-all text-xs text-slate-300 light:text-slate-700 flex flex-col justify-between h-20 group">
                        <span class="font-semibold group-hover:text-sky-400 transition-colors">Write & Edit</span>
                        <span class="text-slate-500 text-[11px]">Product launch announcement copy</span>
                    </button>
                </div>
            </div>

            <div id="messages-list" class="space-y-6 hidden"></div>
        </div>

        <!-- FLOATING COMPOSER -->
        <div class="p-4 max-w-3xl mx-auto w-full">
            <div class="relative bg-slate-900/90 light:bg-white border border-slate-800 light:border-slate-300 rounded-2xl shadow-2xl backdrop-blur-xl focus-within:border-sky-500/80 transition-all">
                <textarea id="composer-input" rows="1" oninput="autoGrow(this)" onkeydown="handleKeyDown(event)" placeholder="Ask anything..." class="w-full bg-transparent text-slate-100 light:text-slate-900 placeholder-slate-500 px-4 pt-3.5 pb-12 rounded-2xl focus:outline-none resize-none max-h-48 text-sm leading-relaxed"></textarea>

                <div class="absolute bottom-2.5 left-3 right-3 flex items-center justify-between pt-2 border-t border-slate-800/40 light:border-slate-200">
                    <button onclick="alert('File attachment integrates with Gemini Multimodal API.')" class="p-1.5 text-slate-500 hover:text-slate-300 rounded-lg hover:bg-slate-800/50" title="Attach file">
                        <i class="fa-solid fa-paperclip text-xs"></i>
                    </button>

                    <div class="flex items-center gap-1.5">
                        <button id="stt-btn" onclick="toggleSpeechToText()" class="p-2 text-slate-400 hover:text-sky-400 rounded-lg hover:bg-slate-800/50 relative" title="Speech to Text">
                            <i id="stt-icon" class="fa-solid fa-microphone text-xs"></i>
                            <span id="stt-pulse" class="absolute inset-0 rounded-lg bg-sky-500/20 animate-ping hidden"></span>
                        </button>

                        <button id="send-btn" onclick="submitMessage()" class="w-8 h-8 rounded-xl bg-sky-600 hover:bg-sky-500 text-white flex items-center justify-center shadow-md shadow-sky-600/20 transition-all active:scale-95">
                            <i id="send-icon" class="fa-solid fa-arrow-up text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
            <p class="text-[10px] text-center text-slate-600 dark:text-slate-500 mt-2">Aether AI Assistant. Powered by Google Gemini API.</p>
        </div>
    </main>

    <!-- FULL SCREEN VOICE MODE OVERLAY -->
    <div id="voice-overlay" class="fixed inset-0 bg-slate-950/98 z-50 backdrop-blur-2xl flex flex-col justify-between p-6 hidden opacity-0 transition-opacity duration-300">
        <div class="flex items-center justify-between max-w-xl mx-auto w-full">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs font-mono uppercase tracking-widest text-slate-400">Live Voice Mode</span>
            </div>
            <button onclick="stopVoiceMode()" class="p-2 text-slate-400 hover:text-white rounded-full bg-slate-900 border border-slate-800">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center my-auto">
            <div class="relative w-64 h-64 sm:w-80 sm:h-80 flex items-center justify-center">
                <canvas id="voice-canvas" class="w-full h-full rounded-full"></canvas>
            </div>
            <div class="mt-8 text-center space-y-1">
                <p id="voice-status-label" class="text-base font-medium text-slate-200">Listening...</p>
                <p id="voice-subtext" class="text-xs text-slate-500">Speak naturally to your assistant</p>
            </div>
        </div>

        <div class="max-w-md mx-auto w-full flex items-center justify-center pb-6">
            <button onclick="stopVoiceMode()" class="w-14 h-14 rounded-full bg-red-600 hover:bg-red-500 text-white flex items-center justify-center shadow-lg shadow-red-600/30 transition-all active:scale-95">
                <i class="fa-solid fa-phone-slash text-base"></i>
            </button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 z-50 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-sm font-semibold text-slate-100">Settings</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">Gemini API Key</label>
                    <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                    <p class="text-[10px] text-slate-500 mt-1">Key is injected via GitHub Actions secret if configured.</p>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                    <button onclick="clearAllData()" class="text-xs text-red-400 hover:text-red-300">Clear All Chats</button>
                    <button onclick="saveSettings()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium px-4 py-2 rounded-xl">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const INJECTED_KEY = "YOUR_GEMINI_API_KEY_PLACEHOLDER";
        const APP_STATE = {
            chats: JSON.parse(localStorage.getItem('aether_chats') || '[]'),
            currentChatId: localStorage.getItem('aether_active_chat') || null,
            apiKey: localStorage.getItem('aether_api_key') || (INJECTED_KEY.startsWith("AIza") ? INJECTED_KEY : ''),
            model: localStorage.getItem('aether_model') || 'gemini-2.5-flash',
            isGenerating: false,
            sttActive: false,
            voiceModeActive: false
        };

        marked.setOptions({ breaks: true });

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('api-key-input').value = APP_STATE.apiKey;
            document.getElementById('model-select').value = APP_STATE.model;
            renderChatList();
            if (APP_STATE.currentChatId && getChatById(APP_STATE.currentChatId)) {
                loadChat(APP_STATE.currentChatId);
            } else {
                createNewChat(false);
            }
        });

        function saveState() {
            localStorage.setItem('aether_chats', JSON.stringify(APP_STATE.chats));
            localStorage.setItem('aether_active_chat', APP_STATE.currentChatId || '');
            localStorage.setItem('aether_api_key', APP_STATE.apiKey);
            localStorage.setItem('aether_model', APP_STATE.model);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light');
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 192) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 768) {
                e.preventDefault();
                submitMessage();
            }
        }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
        function saveSettings() {
            APP_STATE.apiKey = document.getElementById('api-key-input').value.trim();
            saveState();
            closeSettings();
        }

        function changeModel() {
            APP_STATE.model = document.getElementById('model-select').value;
            saveState();
        }

        function createNewChat(switchChat = true) {
            const newChat = { id: 'chat_' + Date.now(), title: 'New Conversation', messages: [] };
            APP_STATE.chats.unshift(newChat);
            if (switchChat) APP_STATE.currentChatId = newChat.id;
            saveState();
            renderChatList();
            if (switchChat) loadChat(newChat.id);
        }

        function getChatById(id) { return APP_STATE.chats.find(c => c.id === id); }

        function loadChat(chatId) {
            APP_STATE.currentChatId = chatId;
            saveState();
            renderChatList();

            const chat = getChatById(chatId);
            const messagesContainer = document.getElementById('messages-list');
            const welcomeState = document.getElementById('welcome-state');

            messagesContainer.innerHTML = '';
            if (!chat || chat.messages.length === 0) {
                welcomeState.classList.remove('hidden');
                messagesContainer.classList.add('hidden');
            } else {
                welcomeState.classList.add('hidden');
                messagesContainer.classList.remove('hidden');
                chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content, msg.id));
            }
        }

        function renderChatList() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';
            APP_STATE.chats.forEach(chat => {
                const isActive = chat.id === APP_STATE.currentChatId;
                const item = document.createElement('div');
                item.className = `group flex items-center justify-between px-3 py-2 rounded-xl cursor-pointer text-xs transition-colors ${isActive ? 'bg-slate-800 text-slate-100 font-medium' : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-300'}`;
                item.onclick = () => loadChat(chat.id);
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i class="fa-regular fa-message text-slate-500"></i>
                        <span class="truncate max-w-[140px]">${escapeHtml(chat.title)}</span>
                    </div>
                    <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 p-1">
                        <i class="fa-solid fa-trash-can text-[10px]"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        function deleteChat(chatId) {
            APP_STATE.chats = APP_STATE.chats.filter(c => c.id !== chatId);
            if (APP_STATE.currentChatId === chatId) {
                APP_STATE.currentChatId = APP_STATE.chats.length > 0 ? APP_STATE.chats[0].id : null;
            }
            saveState();
            if (APP_STATE.currentChatId) loadChat(APP_STATE.currentChatId);
            else createNewChat();
        }

        function usePrompt(text) {
            document.getElementById('composer-input').value = text;
            submitMessage();
        }

        function appendMessageUI(role, content, msgId = 'msg_' + Date.now()) {
            const messagesContainer = document.getElementById('messages-list');
            document.getElementById('welcome-state').classList.add('hidden');
            messagesContainer.classList.remove('hidden');

            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.id = msgId;
            wrapper.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} mb-6`;

            wrapper.innerHTML = `
                <div class="flex gap-3 max-w-[88%] ${isUser ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${isUser ? 'bg-sky-600 text-white' : 'bg-indigo-600 text-white'}">
                        ${isUser ? 'U' : '<i class="fa-solid fa-sparkles text-[10px]"></i>'}
                    </div>
                    <div class="${isUser ? 'bg-sky-600 text-white rounded-2xl px-4 py-2.5 text-xs font-normal' : 'prose prose-invert text-slate-200 text-xs w-full'}">
                        <div class="msg-content">${isUser ? escapeHtml(content) : marked.parse(content)}</div>
                    </div>
                </div>
            `;

            messagesContainer.appendChild(wrapper);
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
            return wrapper;
        }

        async function submitMessage() {
            const inputEl = document.getElementById('composer-input');
            const text = inputEl.value.trim();
            if (!text || APP_STATE.isGenerating) return;

            if (!APP_STATE.apiKey) {
                openSettings();
                return;
            }

            let chat = getChatById(APP_STATE.currentChatId);
            if (!chat) { createNewChat(false); chat = getChatById(APP_STATE.currentChatId); }

            if (chat.messages.length === 0) chat.title = text.length > 22 ? text.substring(0, 22) + '...' : text;

            const userMsg = { id: 'msg_' + Date.now(), role: 'user', content: text };
            chat.messages.push(userMsg);
            appendMessageUI('user', text, userMsg.id);

            inputEl.value = '';
            inputEl.style.height = 'auto';

            const aiMsgId = 'msg_' + (Date.now() + 1);
            const aiWrapper = appendMessageUI('assistant', '...', aiMsgId);
            const contentEl = aiWrapper.querySelector('.msg-content');

            APP_STATE.isGenerating = true;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${APP_STATE.model}:generateContent?key=${APP_STATE.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chat.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] }))
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response produced.';
                contentEl.innerHTML = marked.parse(aiResponse);
                chat.messages.push({ id: aiMsgId, role: 'assistant', content: aiResponse });
                saveState();
                renderChatList();
            } catch (err) {
                contentEl.innerHTML = `<span class="text-red-400">Error generating response.</span>`;
            } finally {
                APP_STATE.isGenerating = false;
            }
        }

        /* Speech-To-Text */
        function toggleSpeechToText() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert('Web Speech API not supported in this browser.');
            
            const rec = new SpeechRecognition();
            rec.onstart = () => document.getElementById('stt-pulse').classList.remove('hidden');
            rec.onresult = (e) => {
                document.getElementById('composer-input').value = e.results[0][0].transcript;
                autoGrow(document.getElementById('composer-input'));
            };
            rec.onend = () => document.getElementById('stt-pulse').classList.add('hidden');
            rec.start();
        }

        /* Voice Mode Simulation & Canvas Orb */
        let voiceAnimationId = null;
        function startVoiceMode() {
            if (!APP_STATE.apiKey) { openSettings(); return; }
            APP_STATE.voiceModeActive = true;
            const overlay = document.getElementById('voice-overlay');
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            initVoiceCanvas();
        }

        function stopVoiceMode() {
            APP_STATE.voiceModeActive = false;
            const overlay = document.getElementById('voice-overlay');
            overlay.classList.add('opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
            if (voiceAnimationId) cancelAnimationFrame(voiceAnimationId);
        }

        function initVoiceCanvas() {
            const canvas = document.getElementById('voice-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 300; canvas.height = 300;
            let step = 0;

            function renderOrb() {
                if (!APP_STATE.voiceModeActive) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(150, 150);

                ctx.beginPath();
                for (let i = 0; i < 360; i += 5) {
                    const angle = (i * Math.PI) / 180;
                    const distortion = Math.sin(angle * 5 + step) * 12;
                    const r = 80 + distortion;
                    const x = r * Math.cos(angle);
                    const y = r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();

                const grad = ctx.createRadialGradient(0, 0, 20, 0, 0, 100);
                grad.addColorStop(0, '#38bdf8');
                grad.addColorStop(0.6, '#6366f1');
                grad.addColorStop(1, 'transparent');

                ctx.fillStyle = grad;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.restore();

                step += 0.05;
                voiceAnimationId = requestAnimationFrame(renderOrb);
            }
            renderOrb();
        }

        function clearAllData() {
            if (confirm('Delete all stored chats?')) {
                APP_STATE.chats = [];
                APP_STATE.currentChatId = null;
                saveState();
                createNewChat();
                closeSettings();
            }
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
